*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:#E6ECF8;overflow:hidden;}
body{font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;color:#081F5C;}

/* The loop is laid out on a fixed 1600x1200 grid — 4:3, the same ratio as the
   card's image panel — then cover-scaled to whatever the card is. Exact at
   every width, and nothing gets cropped. */
.stage{position:absolute;left:50%;top:50%;width:1600px;height:1200px;}

.logo{position:absolute;left:84px;top:80px;display:flex;align-items:center;gap:16px;font-size:40px;font-weight:500;color:#081F5C;}
.logo img{width:52px;height:52px;}

/* The scene is laid out at its natural size and then blown up about the stage
   centre, so a card ~530px tall still renders the 83% at ~115px and the stack
   labels at ~17px. The wordmark sits outside it and keeps its own scale. */
#zoom{position:absolute;inset:0;transform:scale(2.05);}

.mono{font-family:ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.09em;text-transform:uppercase;}

/* ---- the scorecard: where the loop rests, and the idea it argues with ---- */
.card{position:absolute;left:536px;top:410px;width:528px;height:392px;background:#fff;border-radius:16px;
      box-shadow:0 0 0 1px rgba(8,31,92,.10),0 24px 60px -34px rgba(8,31,92,.45);}
.card-label{position:absolute;left:584px;top:462px;font-size:21px;color:#5A6A92;}
.card-pct{position:absolute;left:582px;top:492px;font-size:128px;font-weight:700;line-height:1;letter-spacing:-.04em;color:#081F5C;}
.card-rule{position:absolute;left:584px;top:672px;width:432px;height:1px;background:rgba(8,31,92,.12);}
.card-fail{position:absolute;left:584px;top:700px;font-size:21px;color:#C41C1C;}

/* The 36 squares are the loop's only real actors. They start packed edge to
   edge into the scorecard's red bar, then break out of it and sort themselves.
   Everything is transform + background, so the whole thing stays on the
   compositor. */
.sq{position:absolute;left:0;top:0;width:24px;height:24px;border-radius:4px;background:#C41C1C;
    transform:translate(584px,738px);}

.stack-label{position:absolute;font-size:19px;opacity:0;}
</style>

  <div id="zoom">
  <div class="card" id="card"></div>
  <div class="card-label mono" id="t1">Resolution rate</div>
  <div class="card-pct" id="t2">83%</div>
  <div class="card-rule" id="t3"></div>
  <div class="card-fail mono" id="t4">Counted as failures</div>

  <div class="stack-label mono" id="lblOk"  style="left:564px;top:470px;color:#146C3C;">Working as intended</div>
  <div class="stack-label mono" id="lblErr" style="left:888px;top:470px;color:#C41C1C;">Handoff errors</div>

  <div id="squares"></div>
  </div>
</div>
<script>
(function(){
  var stage=document.getElementById('stage');
  function fit(){ var s=Math.max(innerWidth/1600,innerHeight/1200); stage.style.transform='translate(-50%,-50%) scale('+s+')'; }
  fit(); addEventListener('resize',fit);

  /* 36 squares stand in for a day of transfers, at the study's real ratio:
     374 handoffs that worked as intended against 32 genuine errors, which is
     33 to 3 once it fits in a card. */
  var N=36, ERR=3, OK=N-ERR;
  var SIZE=24;

  /* Packed: 18 across, 2 down, no gaps, so the set reads as one solid bar. */
  var BAR_X=584, BAR_Y=738, BAR_COLS=18;
  function barPos(i){ return [BAR_X+(i%BAR_COLS)*SIZE, BAR_Y+Math.floor(i/BAR_COLS)*SIZE]; }

  /* Sorted: two labelled stacks, 8px gutters, the pair centred on the stage. */
  var P=SIZE+8, TOP=520, OK_X=564, OK_COLS=6, ERR_X=888;
  function okPos(i){ return [OK_X+(i%OK_COLS)*P, TOP+Math.floor(i/OK_COLS)*P]; }
  function errPos(i){ return [ERR_X+i*P, TOP]; }
  function sortedPos(i){ return i<OK ? okPos(i) : errPos(i-OK); }

  var GREEN='#146C3C', RED='#C41C1C';
  var box=document.getElementById('squares'), sq=[];
  for(var i=0;i<N;i++){
    var e=document.createElement('div'); e.className='sq';
    box.appendChild(e); sq.push(e);
  }

  var card=['card','t1','t2','t3','t4'].map(function(id){ return document.getElementById(id); });
  var labels=[document.getElementById('lblOk'),document.getElementById('lblErr')];

  function setSorted(){
    sq.forEach(function(e,i){
      var p=sortedPos(i);
      e.style.transform='translate('+p[0]+'px,'+p[1]+'px)';
      e.style.background=i<OK?GREEN:RED;
    });
    card.forEach(function(e){ e.style.opacity=0; });
    labels.forEach(function(e){ e.style.opacity=1; });
  }
  function setScorecard(){
    sq.forEach(function(e,i){
      var p=barPos(i);
      e.style.transform='translate('+p[0]+'px,'+p[1]+'px)';
      e.style.background=RED;
    });
    card.forEach(function(e){ e.style.opacity=1; });
    labels.forEach(function(e){ e.style.opacity=0; });
  }

  if(matchMedia('(prefers-reduced-motion: reduce)').matches || !stage.animate){ setSorted(); return; }

  setScorecard();

  var running=[], timers=[];
  function anim(el,frames,opts){ var a=el.animate(frames,opts); running.push(a); return a; }
  function later(fn,ms){ timers.push(setTimeout(fn,ms)); }

  /* One pass: the scorecard holds, its red bar breaks apart, the pieces sort
     themselves into the two stacks, and the three that really were mistakes
     pulse once. Then it resets and rests on the scorecard again. */
  var HOLD=1500, BREAK=260, FLIGHT=900, SETTLE=1500, LOOP=7200;

  function pass(){
    /* the card recedes, leaving its red bar mid-air */
    [card[0],card[1],card[2],card[3]].forEach(function(el,k){
      anim(el,[{opacity:1,transform:'scale(1)'},{opacity:0,transform:'scale(.97)'}],
        {duration:420,delay:HOLD+k*30,easing:'cubic-bezier(.4,0,.6,1)',fill:'forwards'});
    });
    anim(card[4],[{opacity:1},{opacity:0}],{duration:300,delay:HOLD+320,easing:'ease-out',fill:'forwards'});

    sq.forEach(function(e,i){
      var from=barPos(i), to=sortedPos(i), ok=i<OK;
      /* a short scatter out of the bar before the sort, so it breaks rather
         than slides — the errors scatter hardest and land last */
      var jx=(Math.random()-.5)*150, jy=(Math.random()-.5)*110 - 30;
      var delay=HOLD+200+ (ok ? i*14 : 420+ (i-OK)*90 );
      anim(e,[
        {transform:'translate('+from[0]+'px,'+from[1]+'px) scale(1)',background:RED},
        {transform:'translate('+(from[0]+jx)+'px,'+(from[1]+jy)+'px) scale(1.18)',background:RED,offset:.28},
        {transform:'translate('+to[0]+'px,'+to[1]+'px) scale(1)',background:ok?GREEN:RED}
      ],{duration:BREAK+FLIGHT,delay:delay,easing:'cubic-bezier(.34,.8,.3,1)',fill:'forwards'});
    });

    labels.forEach(function(el,k){
      anim(el,[{opacity:0,transform:'translateY(6px)'},{opacity:1,transform:'translateY(0)'}],
        {duration:420,delay:HOLD+900+k*160,easing:'ease-out',fill:'forwards'});
    });

    /* the punchline: three squares out of thirty-six */
    later(function(){
      for(var i=OK;i<N;i++){
        (function(el,p){
          var at='translate('+p[0]+'px,'+p[1]+'px)';
          anim(el,[{transform:at+' scale(1)'},{transform:at+' scale(1.45)',offset:.35},{transform:at+' scale(1)'}],
            {duration:760,easing:'cubic-bezier(.2,.7,.3,1)'});
        })(sq[i],sortedPos(i));
      }
    }, HOLD+BREAK+FLIGHT+SETTLE);

    /* fade the sorted state back to the scorecard */
    later(function(){
      sq.forEach(function(e){ anim(e,[{opacity:1},{opacity:0}],{duration:420,easing:'ease-in',fill:'forwards'}); });
      labels.forEach(function(e){ anim(e,[{opacity:1},{opacity:0}],{duration:420,easing:'ease-in',fill:'forwards'}); });
    }, LOOP-700);
    later(function(){
      reset();
      sq.forEach(function(e){ anim(e,[{opacity:0},{opacity:1}],{duration:300,easing:'ease-out'}); });
      card.forEach(function(e){ anim(e,[{opacity:0},{opacity:1}],{duration:400,easing:'ease-out'}); });
    }, LOOP-220);
  }

  function reset(){
    running.forEach(function(a){ a.cancel(); }); running=[];
    sq.forEach(function(e){ e.style.opacity=''; });
    setScorecard();
  }
  function stopAll(){
    timers.forEach(clearTimeout); timers=[];
    running.forEach(function(a){ a.cancel(); }); running=[];
    reset();
  }

  var loop=null;
  function start(){ if(loop) return; pass(); loop=setInterval(pass,LOOP); }
  function stop(){ clearInterval(loop); loop=null; stopAll(); }

  /* The card owns playback: DomuThumbnail posts domu:play on hover (or when the
     card scrolls into view on touch) and domu:pause when it leaves, so the loop
     rests on the scorecard — the idea the study argues against — the rest of
     the time, and the break only happens while someone is looking. */
  var playing=false;
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():(playing&&start()); });
  addEventListener('message',function(e){
    if(e.data==='domu:play'){ playing=true; if(!document.hidden) start(); }
    else if(e.data==='domu:pause'){ playing=false; stop(); }
  });
})();
</script>
