<title>Spill-aware orders</title>

<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --ui:'Baloo 2','Baloo Tamma 2','Baloo Thambi 2','Baloo Tammudu 2','Baloo Da 2','Baloo Bhai 2','Baloo Chettan 2',system-ui,-apple-system,'Segoe UI',sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(1000px 760px at 90% 0%,rgba(255,237,158,.32),transparent 60%),radial-gradient(900px 700px at 0% 100%,rgba(241,104,56,.35),transparent 62%),linear-gradient(160deg,#0A4A37 0%,#04291D 100%);font-family:var(--ui);color:#F4FBEA;-webkit-font-smoothing:antialiased}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:50% 50%}
#kick{position:absolute;left:0;right:0;top:40px;text-align:center}
#kick span{display:inline-block;font-weight:800;font-size:26px;color:#124224;background:#CEF17B;border-radius:999px;padding:2px 20px}
#hl{position:absolute;left:0;right:0;top:100px;text-align:center;font-weight:800;font-size:72px;line-height:1.1;letter-spacing:-.015em;white-space:nowrap}
#dev{position:absolute;left:342px;top:222px;width:1236px;height:704px;padding:10px;border-radius:34px;background:#1B211E;box-shadow:0 40px 80px -30px rgba(0,0,0,.75)}
#scr{position:relative;width:1216px;height:684px;border-radius:21px;overflow:hidden;isolation:isolate;z-index:0}
#scr img{position:absolute;inset:0;width:100%;height:100%}
#dim{position:absolute;left:352px;top:232px;width:1216px;height:684px;border-radius:21px;background:rgba(2,20,14,.6);opacity:0;visibility:hidden}
#pop{position:absolute;opacity:0;visibility:hidden;box-shadow:0 0 0 3px #CEF17B,0 0 70px rgba(206,241,123,.45),0 34px 60px -24px rgba(0,0,0,.75)}
#ring{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:4px solid #CEF17B;opacity:0;visibility:hidden}
#cap{position:absolute;left:0;right:0;top:960px;text-align:center;font-size:42px;font-weight:600;white-space:nowrap}
#cap svg,.chip svg{width:38px;height:38px;vertical-align:-7px;margin-right:10px;fill:none;stroke:#CEF17B;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.chip{position:absolute;display:inline-flex;align-items:center;gap:4px;font-size:34px;font-weight:800;color:#124224;background:#CEF17B;border-radius:999px;padding:6px 24px 6px 16px;opacity:0;visibility:hidden;white-space:nowrap;box-shadow:0 20px 40px -16px rgba(0,0,0,.6)}
.chip svg{stroke:#124224;margin-right:4px}
#steps{position:absolute;left:0;right:0;top:960px;display:flex;justify-content:center;gap:14px}
#steps span{font-size:34px;font-weight:700;border-radius:999px;padding:4px 22px;background:rgba(244,251,234,.12);color:rgba(244,251,234,.55);transition:none}
#steps span.on{background:#CEF17B;color:#124224}
</style>
