*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(1000px 760px at 90% 0%,rgba(206,241,123,.3),transparent 60%),radial-gradient(900px 700px at 0% 100%,rgba(242,169,59,.32),transparent 62%),linear-gradient(160deg,#0A4A37 0%,#04291D 100%);font-family:var(--ui);color:#F4FBEA;-webkit-font-smoothing:antialiased}
